id = "local.agent-icons"
name = "Agent Icons"
version = "0.2.0"
min_herdr_version = "0.7.0"
description = "Report a per-agent emoji/glyph as the $icon sidebar token."
platforms = ["linux", "macos"]

[[startup]]
command = ["sh", "run.sh"]

[[actions]]
id = "refresh"
title = "Agent icons: refresh now"
contexts = ["global"]
command = ["sh", "report-once.sh"]

[[actions]]
id = "install-font"
title = "Agent icons: install logo font"
contexts = ["global"]
platforms = ["macos", "linux"]
command = ["sh", "install-font.sh"]
